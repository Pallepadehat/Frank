name: Frank
options:
  bundleIdPrefix: co.visionairy.frank
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Frank:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: [Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.visionairy.frank.phone
        PRODUCT_NAME: Frank
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 537P4FPMZ4
        # Set your team in Xcode (Signing & Capabilities) the first time you run it.
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Frank
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Frank finds the Mac app on your Wi-Fi so the character can look where it points.
        NSMicrophoneUsageDescription: Talk to your blueberry. He listens while he's awake (double tap him to wake him up or put him to sleep).
        NSBonjourServices:
          - _frank._tcp
        UIAppFonts:
          - Fredoka.ttf
          - IBMPlexSans.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf

  # The Mac menu bar app. Also builds without Xcode: ./scripts/build-mac.sh (from Package.swift).
  FrankMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes: [Info.plist]
      - path: Shared/Fonts
        buildPhase: resources
    dependencies:
      - target: FrankShared
    settings:
      base:
        PRODUCT_NAME: Frank
        PRODUCT_BUNDLE_IDENTIFIER: co.visionairy.frank.mac
        INFOPLIST_FILE: Mac/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 537P4FPMZ4
        ENABLE_HARDENED_RUNTIME: NO

  # Code both apps share. The Mac app imports it as a module; the iPhone app compiles it in directly.
  FrankShared:
    type: library.static
    platform: macOS
    sources:
      - path: Shared
        excludes: [Fonts]
