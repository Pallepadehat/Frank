name: Frank
options:
  bundleIdPrefix: com.jakobsendevelopment.frank
  xcodeVersion: "27.0"
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Xcode's recommended settings.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # On-device speech recognition (WhisperKit).
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.1
  # On-device language model for tidying transcripts.
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 1.0.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.5

targets:
  Frank:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: iOS
        excludes: [Info.plist]
      - path: Shared
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    entitlements:
      path: iOS/Frank.entitlements
      properties:
        # Speech and language models need more memory than iOS gives an app by default.
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakobsendevelopment.frank.phone
        PRODUCT_NAME: Frank
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 537P4FPMZ4
        # Info.plist keys live here; iOS/Info.plist only has what build settings can't express.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Frank
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Frank finds the Mac app on your Wi-Fi so the character can look where it points.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk to Frank. He listens while he's awake (double tap him to wake him up or put him to sleep).
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        REGISTER_APP_GROUPS: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  # The Mac menu bar app. Also builds without Xcode: ./scripts/build-mac.sh (from Package.swift).
  FrankMac:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Mac
        excludes: [Info.plist]
      - path: Shared/Fonts
        buildPhase: resources
    dependencies:
      - target: FrankShared
    settings:
      base:
        PRODUCT_NAME: Frank
        PRODUCT_BUNDLE_IDENTIFIER: com.jakobsendevelopment.frank.mac
        INFOPLIST_FILE: Mac/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 537P4FPMZ4
        ENABLE_HARDENED_RUNTIME: NO

  # Code both apps share. The Mac app imports it as a module; the iPhone app compiles it in directly.
  FrankShared:
    type: library.static
    platform: macOS
    sources:
      - path: Shared
        excludes: [Fonts]
    settings:
      base:
        # Nothing uses an Objective-C header for it, and copying one trips Xcode's script sandbox.
        SWIFT_INSTALL_OBJC_HEADER: NO
